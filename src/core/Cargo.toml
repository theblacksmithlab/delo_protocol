[package]
name = "trust-core"
version = "0.1.0"
edition = "2021"

[lib]
# cdylib = C dynamic library, required for WASM output
crate-type = ["cdylib"]

[dependencies]
# wasm-bindgen bridges Rust types ↔ JS types at the WASM boundary
wasm-bindgen = "0.2"
# serde: serialization framework. "derive" feature enables #[derive(Serialize, Deserialize)]
serde = { version = "1", features = ["derive"] }
# serde_json: JSON encoding/decoding — deals stored and transferred as JSON
serde-wasm-bindgen = "0.6"
# hex: encode/decode byte arrays as hex strings for JSON serialization
hex = "0.4"

[dev-dependencies]
# serde_json used only in tests for round-trip checks
serde_json = "1"
